<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f3f3">
  <title>Simple List</title>
  <link rel="stylesheet" href="styles.css?v=1.2.2">
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <form id="auth-form" class="auth-dialog">
      <h1>Simple List</h1>
      <span class="auth-version">Version 1.2.2</span>
      <p>Sign in to open your list.</p>
      <label for="auth-email">Email</label>
      <input id="auth-email" type="email" autocomplete="username" required>
      <label for="auth-password">Password</label>
      <input id="auth-password" type="password" autocomplete="current-password" required minlength="6">
      <p id="auth-message" class="auth-message" aria-live="polite"></p>
      <div class="auth-actions">
        <button type="submit">Sign in</button>
        <button id="sign-up" type="button">Create account</button>
      </div>
    </form>
  </div>

  <dialog id="item-dialog" class="item-dialog">
    <form id="item-dialog-form">
      <h2 id="item-dialog-heading">Item name</h2>
      <label for="item-dialog-input">Item name</label>
      <input id="item-dialog-input" type="text" maxlength="250" required>
      <div class="dialog-actions">
        <button id="item-dialog-cancel" type="button">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <main class="app-shell">
    <section class="items-panel" aria-labelledby="items-heading">
      <div class="panel-heading">
        <h1 id="items-heading" class="visually-hidden">Items</h1>
        <button id="add-item" class="icon-button" type="button" aria-label="Add item" title="Add item">+</button>
        <div class="item-actions">
          <button id="rename-item" type="button">Rename</button>
          <button id="delete-item" class="danger" type="button">Delete</button>
        </div>
      </div>

      <div id="item-list" class="item-list" role="listbox" aria-label="Items"></div>
    </section>

    <section class="notes-panel" aria-labelledby="notes-heading">
      <div class="panel-heading notes-heading-row">
        <h2 id="notes-heading">Notes</h2>
        <div class="session-tools">
          <span id="save-status" class="save-status" aria-live="polite">Saved</span>
          <span id="app-version" class="app-version">Version 1.2.2</span>
          <button id="sign-out" type="button">Sign out</button>
        </div>
      </div>

      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Text formatting">
        <button type="button" data-command="bold" aria-label="Bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
        <button type="button" data-command="italic" aria-label="Italic" title="Italic (Ctrl+I)"><em>I</em></button>
        <button type="button" data-command="underline" aria-label="Underline" title="Underline (Ctrl+U)"><u>U</u></button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button type="button" data-command="insertUnorderedList" aria-label="Bullet list" title="Bullet list">&#8226; List</button>
        <button type="button" data-command="insertOrderedList" aria-label="Numbered list" title="Numbered list">1. List</button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button id="add-timestamp" type="button" aria-label="Insert timestamp" title="Insert current date and time">Date / time</button>
      </div>

      <div
        id="notes-editor"
        class="notes-editor"
        contenteditable="true"
        role="textbox"
        aria-multiline="true"
        aria-label="Notes"
        data-placeholder="Write a note…"
      ></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.55.0/dist/umd/supabase.min.js"></script>
  <script src="app.js?v=1.2.2"></script>
</body>
</html>
